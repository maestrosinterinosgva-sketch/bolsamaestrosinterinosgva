stages:
  - update

actualizar_adjudicaciones:
  stage: update
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /\[skip ci\]/'
      when: never
  before_script:
    - apt-get update && apt-get install -y git
    - pip install --no-cache-dir pymupdf
  script:
    - python bot_telegram.py
    - python bot_auto_actualizador.py
    - |
      git config --global user.name "Bot Adjudicaciones"
      git config --global user.email "bot@interinos.valencia"
      git remote set-url origin https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git
      git add -A data/ index.html interinos_web.zip
      if git diff --staged --quiet; then
        echo "No hay cambios nuevos que guardar."
      else
        git commit -m "Actualización automática de adjudicaciones [skip ci]"
        git push origin HEAD:${CI_DEFAULT_BRANCH}
      fi

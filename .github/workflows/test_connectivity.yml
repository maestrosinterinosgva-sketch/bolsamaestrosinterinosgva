name: Test Conselleria Connectivity

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Direct test
        run: |
          echo "=== Direct curl to Conselleria ==="
          curl -I -m 10 "https://ceice.gva.es/es/web/rrhh-educacion/resolucion" || echo "Direct failed as expected"

      - name: Install and configure Tor with Spanish exit nodes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor
          echo "ExitNodes {es}" | sudo tee -a /etc/tor/torrc
          echo "StrictNodes 1" | sudo tee -a /etc/tor/torrc
          sudo systemctl restart tor
          sleep 5

      - name: Check Tor IP & Country
        run: |
          curl --socks5-hostname 127.0.0.1:9050 -s https://ipinfo.io/json || true

      - name: Test Conselleria via Tor Spanish Exit Node
        run: |
          curl --socks5-hostname 127.0.0.1:9050 -I -m 25 "https://ceice.gva.es/es/web/rrhh-educacion/resolucion" || echo "Tor failed"

name: Actualización Automática Semanal de Adjudicaciones

on:
  push:
    paths:
      - '2*.pdf'
      - 'adjudicacion*.pdf'
      - 'telegram_*.pdf'
  schedule:
    # Martes y Jueves de 07:30 a 12:00 (hora peninsular española)
    # Ejecuta cada 10 minutos durante la franja oficial de publicación
    # (05:00 a 11:00 UTC cubre tanto horario de verano UTC+2 como de invierno UTC+1)
    - cron: '*/10 5-11 * * 2,4'
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'URL del nuevo PDF de adjudicaciones (opcional si quieres forzar uno específico)'
        required: false
        default: ''

concurrency:
  group: auto-update-adjudicaciones
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf

      - name: Ejecutar comprobación del bot (Telegram y Fuentes)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 1. Comprobar si el usuario envió un PDF por Telegram
          python bot_telegram.py

          # 2. Si se pasa una URL manual o se rastrean las fuentes
          if [ -n "${{ github.event.inputs.pdf_url }}" ]; then
            python actualizar_adjudicacion.py "${{ github.event.inputs.pdf_url }}"
          else
            python bot_auto_actualizador.py
          fi

      - name: Validar integridad de los datos calculados
        run: |
          python -m unittest discover -s tests

      - name: Guardar y publicar cambios en la web
        run: |
          git config --global user.name "Bot Adjudicaciones"
          git config --global user.email "bot@interinos.valencia"
          git add data/ index.html interinos_web.zip
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos que guardar."
          else
            git commit -m "Actualización automática de adjudicaciones [skip ci]"
            git push
          fi

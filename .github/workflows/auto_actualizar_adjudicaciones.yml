name: Actualización Automática Semanal de Adjudicaciones

on:
  schedule:
    # Se ejecuta cada 15 minutos los martes y jueves de 08:00 a 16:00 UTC (10:00 a 18:00 hora española)
    - cron: '*/15 8-16 * * 2,4'
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'URL del nuevo PDF de adjudicaciones (opcional si quieres forzar uno específico)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf

      - name: Ejecutar comprobación continua cada minuto
        run: |
          if [ -n "${{ github.event.inputs.pdf_url }}" ]; then
            python actualizar_adjudicacion.py "${{ github.event.inputs.pdf_url }}"
          else
            python bot_auto_actualizador.py --continuous
          fi

      - name: Guardar y publicar cambios en la web
        run: |
          git config --global user.name "Bot Adjudicaciones"
          git config --global user.email "bot@interinos.valencia"
          git add data/ index.html interinos_web.zip
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos que guardar."
          else
            git commit -m "Actualización automática de adjudicaciones [skip ci]"
            git push
          fi

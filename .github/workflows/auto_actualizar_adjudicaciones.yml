name: Actualización Automática Multiportal de Adjudicaciones

on:
  push:
    paths:
      - '2*.pdf'
      - 'adjudicacion*.pdf'
      - 'telegram_*.pdf'
  schedule:
    # Martes y Jueves de 07:30 a 14:00 (hora peninsular española)
    # Ejecuta cada 15 minutos durante la franja oficial de publicación
    - cron: '*/15 6-12 * * 2,4'
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'URL o nombre del nuevo PDF de adjudicaciones (opcional)'
        required: false
        default: ''

concurrency:
  group: auto-update-adjudicaciones
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf

      - name: Ejecutar actualización multiportal (Maestros, Secundaria y Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.pdf_url }}" ]; then
            python actualizar_multiportal.py --pdf "${{ github.event.inputs.pdf_url }}" --no-push
          else
            python actualizar_multiportal.py --no-push
          fi

      - name: Validar integridad de los datos calculados
        run: |
          python -m unittest discover -s tests

      - name: Guardar y publicar cambios en la web
        run: |
          git config --global user.name "Bot Adjudicaciones"
          git config --global user.email "bot@interinos.valencia"
          git add data/ index.html secundaria/ sitemap.xml guia-adjudicaciones.html especialidades.html sobre-el-proyecto.html interinos_web.zip
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos que guardar."
          else
            git commit -m "Actualización automática multiportal de adjudicaciones [skip ci]"
            git push
          fi
